name: postgis-geo-service

services:
  db:
    build: docker/postgis
    restart: unless-stopped
    environment:
      # The container superuser is the migration role, not the service role.
      POSTGRES_USER: ${MIGRATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-geo_service}
    ports:
      # Loopback only: never publish a database with a default password.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep PGDATA in a versioned directory under this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP: the entrypoint's temporary init server answers on the socket only.
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U ${MIGRATION_DB_USER:-postgres} -d ${DB_NAME:-geo_service}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # The service's own role is created by a migration, so the API cannot
  # connect until this has run.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-geo_service}
      DB_USER: ${DB_USER:-geo_app}
      DB_PASS: ${DB_PASS:-geo_app}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-postgres}
      MIGRATION_DB_PASS: ${MIGRATION_DB_PASS:-postgres}
      MIGRATIONS_DIR: /app/migrations
    command: ['node', 'dist/scripts/migrate.js', 'up']

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-geo_service}
      DB_USER: ${DB_USER:-geo_app}
      DB_PASS: ${DB_PASS:-geo_app}
      PORT: 3000
      # Not ${OSRM_URL}: that is the host-side localhost address for a service
      # run outside Docker; this container reaches OSRM by service name.
      OSRM_URL: ${API_OSRM_URL:-}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'

  # Downloads and preprocesses an OSM extract. Runs once, then exits.
  # Reprocessing only happens when the .osrm files are missing from the volume.
  osrm-init:
    profiles: ['routing']
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    volumes:
      - osrm-data:/data
    environment:
      OSRM_REGION_NAME: ${OSRM_REGION_NAME:-monaco}
      OSRM_REGION_URL: ${OSRM_REGION_URL:-https://download.geofabrik.de/europe/monaco-latest.osm.pbf}
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        cd /data
        if [ -f "$${OSRM_REGION_NAME}.osrm.mldgr" ]; then
          echo "[osrm-init] $${OSRM_REGION_NAME} already processed, skipping."
          exit 0
        fi
        echo "[osrm-init] downloading $${OSRM_REGION_URL}"
        # The image ships neither curl nor wget.
        apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl
        curl -fsSL -o "$${OSRM_REGION_NAME}.osm.pbf" "$${OSRM_REGION_URL}"
        osrm-extract -p /opt/car.lua --data_version "osm-$$(date -u +%F)" "$${OSRM_REGION_NAME}.osm.pbf"
        osrm-partition "$${OSRM_REGION_NAME}.osrm"
        osrm-customize "$${OSRM_REGION_NAME}.osrm"
        echo "[osrm-init] done."

  osrm:
    profiles: ['routing']
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    restart: unless-stopped
    depends_on:
      osrm-init:
        condition: service_completed_successfully
    volumes:
      - osrm-data:/data
    ports:
      - '127.0.0.1:${OSRM_PORT:-5000}:5000'
    command: >
      osrm-routed --algorithm mld
      /data/${OSRM_REGION_NAME:-monaco}.osrm

volumes:
  pgdata:
  osrm-data:
