# Production stack. Driven by bin/deploy.sh, which sets GEO_VERSION; see README.md.
name: postgis-geo-service-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-geo_service}
  # Fixed: the grants in the migrations name this role.
  DB_USER: geo_app
  DB_PASS: ${DB_PASS:?DB_PASS must be set in .env}

services:
  db:
    # Pinned apart from GEO_VERSION: a rollback must not run an older server on newer data.
    image: ghcr.io/gokhanjs/postgis-geo-service-db:${DB_VERSION:?DB_VERSION must be set in .env}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MIGRATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASS:?MIGRATION_DB_PASS must be set in .env}
      POSTGRES_DB: ${DB_NAME:-geo_service}
    command: ['postgres', '-c', 'shared_buffers=512MB']
    # Docker's 64 MB default fails parallel queries with "could not resize shared memory segment".
    shm_size: 256m
    volumes:
      # PostgreSQL 18 images keep PGDATA in a versioned directory under this path.
      - pgdata:/var/lib/postgresql
    networks: [internal]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U ${MIGRATION_DB_USER:-postgres} -d ${DB_NAME:-geo_service}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  migrate:
    image: ghcr.io/gokhanjs/postgis-geo-service:${GEO_VERSION:?GEO_VERSION must be set}
    <<: *hardening
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-postgres}
      MIGRATION_DB_PASS: ${MIGRATION_DB_PASS:?MIGRATION_DB_PASS must be set in .env}
      MIGRATIONS_DIR: /app/migrations
    command: ['node', 'dist/scripts/migrate.js', 'up']
    networks: [internal]
    mem_limit: 256m
    cpus: 1
    logging: *logging

  api:
    image: ghcr.io/gokhanjs/postgis-geo-service:${GEO_VERSION:?GEO_VERSION must be set}
    <<: *hardening
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      PORT: 3000
      OSRM_URL: ${OSRM_URL:-}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Defaults restated: the service parses an empty string as NaN, not as unset.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-1000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-262144}
    ports:
      # Loopback only: Docker's published ports bypass the host firewall.
      - '127.0.0.1:${API_PORT:-3100}:3000'
    # A container on an internal network alone cannot publish a port.
    networks: [internal, edge]
    mem_limit: 512m
    cpus: 2
    logging: *logging

networks:
  # Fixed names, so containers started outside this file (routing) can join.
  internal:
    name: geo_internal
    internal: true
  edge:
    name: geo_edge

volumes:
  pgdata:
