# X-Forwarded-For must be OVERWRITTEN here, not appended to: the service trusts
# a fixed number of hops, and $proxy_add_x_forwarded_for would let a client put
# any address at the head of the chain and be believed.

upstream geo_service {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Edge shedding. The per-key quota lives in the service itself.
limit_req_zone $binary_remote_addr zone=geo_edge:10m rate=30r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name geo.example.com;

    ssl_certificate     /etc/letsencrypt/live/geo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geo.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Keep in agreement with the service's BODY_LIMIT_BYTES.
    client_max_body_size 256k;

    gzip on;
    gzip_types application/json application/problem+json;
    gzip_min_length 1024;

    location / {
        limit_req zone=geo_edge burst=60 nodelay;

        proxy_pass http://geo_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /health/live {
        access_log off;
        proxy_pass http://geo_service;
    }
}

server {
    listen 80;
    server_name geo.example.com;
    return 301 https://$host$request_uri;
}
