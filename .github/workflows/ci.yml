name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A new push supersedes whatever is still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: geo_service_test
      TEST_DB_NAME: geo_service_test
      # The suite drives the service as the restricted role and asserts what it
      # cannot reach, so both sets of credentials have to be present.
      DB_USER: geo_app
      DB_PASS: geo_app
      MIGRATION_DB_USER: postgres
      MIGRATION_DB_PASS: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate

      # The database is our own image, built here as on a developer machine,
      # because no published PostGIS image covers both architectures.
      - run: docker compose up -d --wait db

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      # The invariants AGENTS.md states, checked rather than trusted. ESLint
      # covers the layering rule; these are the ones it cannot express.
      - name: Architecture invariants
        run: |
          set -e
          # Casting a PARAMETER is fine and necessary; casting the indexed
          # COLUMN inside a predicate is what defeats the GiST index.
          if grep -rnE '(location|area)::(geography|geometry)' src/ --include='*.ts' | grep -vE '^[^:]+:[0-9]+:\s*(//|\*|/\*)' | grep -v 'ST_X\|ST_Y'; then
            echo "Casting the indexed column stops the GiST index being usable." >&2
            exit 1
          fi
          if grep -rn 'ST_Contains' src/ --include='*.ts' | grep -vE '^[^:]+:[0-9]+:\s*(//|\*|/\*)'; then
            echo "Use ST_Covers: ST_Contains excludes shared boundaries." >&2
            exit 1
          fi
          if grep -rln 'from .pg.' src/routes src/services 2>/dev/null | grep .; then
            echo "SQL belongs in src/repositories/." >&2
            exit 1
          fi
          echo "Architecture invariants hold."

      - name: Build the production image
        run: docker build -f docker/Dockerfile -t postgis-geo-service:ci .

      - name: Build the data pipeline image
        run: |
          docker build -f docker/Dockerfile --target tools -t postgis-geo-service:ci-tools .
          docker run --rm postgis-geo-service:ci-tools osmium --version

  # The verify job runs the routing contract against a stub; this one runs it
  # against a real engine built by the same compose profile developers use.
  routing:
    runs-on: ubuntu-24.04

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: geo_service_test
      TEST_DB_NAME: geo_service_test
      DB_USER: geo_app
      DB_PASS: geo_app
      MIGRATION_DB_USER: postgres
      MIGRATION_DB_PASS: postgres
      OSRM_URL: http://127.0.0.1:5000
      # Runners are intermittently refused by download.geofabrik.de, so the
      # engine is built from the extract pinned in the repository.
      OSRM_REGION_URL: file:///fixtures/monaco.osm.pbf

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: docker compose up -d --wait db

      - run: docker compose --profile routing up -d osrm

      - name: Wait for OSRM
        run: |
          for _ in $(seq 60); do
            curl -fsS "$OSRM_URL/route/v1/driving/7.4284,43.7393;7.4156,43.7276?overview=false" >/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Routing suite against OSRM
        run: |
          pnpm vitest run test/integration/routing.test.ts \
            --reporter=default --reporter=json --outputFile.json=routing-results.json
          # The real-engine tests skip without OSRM_URL, which would still pass.
          jq -e '.numPendingTests == 0' routing-results.json

      - name: OSRM logs
        if: failure()
        run: docker compose --profile routing logs osrm-init osrm
