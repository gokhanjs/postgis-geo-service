name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever is still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geo_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: geo_service_test
      TEST_DB_NAME: geo_service_test
      # The suite drives the service as the restricted role and asserts what it
      # cannot reach, so both sets of credentials have to be present.
      DB_USER: geo_app
      DB_PASS: geo_app
      MIGRATION_DB_USER: postgres
      MIGRATION_DB_PASS: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      # The invariants AGENTS.md states, checked rather than trusted. ESLint
      # covers the layering rule; these are the ones it cannot express.
      - name: Architecture invariants
        run: |
          set -e
          # Casting a PARAMETER is fine and necessary; casting the indexed
          # COLUMN inside a predicate is what defeats the GiST index.
          if grep -rnE '(location|area)::(geography|geometry)' src/ --include='*.ts' | grep -vE '^[^:]+:[0-9]+:\s*(//|\*|/\*)' | grep -v 'ST_X\|ST_Y'; then
            echo "Casting the indexed column stops the GiST index being usable." >&2
            exit 1
          fi
          if grep -rn 'ST_Contains' src/ --include='*.ts' | grep -vE '^[^:]+:[0-9]+:\s*(//|\*|/\*)'; then
            echo "Use ST_Covers: ST_Contains excludes shared boundaries." >&2
            exit 1
          fi
          if grep -rln 'from .pg.' src/routes src/services 2>/dev/null | grep .; then
            echo "SQL belongs in src/repositories/." >&2
            exit 1
          fi
          echo "Architecture invariants hold."

      - name: Build the production image
        run: docker build -f docker/Dockerfile -t postgis-geo-service:ci .
